<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <!-- Cloud/Network graphic -->
  <g transform="translate(280, 20)">
    <ellipse cx="40" cy="35" rx="45" ry="25" fill="#FFFFFF" opacity="0.15"/>
    <ellipse cx="25" cy="30" rx="30" ry="20" fill="#FFFFFF" opacity="0.1"/>
    <ellipse cx="55" cy="30" rx="30" ry="20" fill="#FFFFFF" opacity="0.1"/>

    <!-- Network nodes -->
    <circle cx="20" cy="35" r="4" fill="#FF6B00"/>
    <circle cx="40" cy="25" r="4" fill="#FF6B00"/>
    <circle cx="60" cy="35" r="4" fill="#FF6B00"/>
    <circle cx="40" cy="45" r="4" fill="#FF6B00"/>

    <!-- Connection lines -->
    <line x1="20" y1="35" x2="40" y2="25" stroke="#FF6B00" stroke-width="1.5" opacity="0.6"/>
    <line x1="40" y1="25" x2="60" y2="35" stroke="#FF6B00" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="35" x2="40" y2="45" stroke="#FF6B00" stroke-width="1.5" opacity="0.6"/>
    <line x1="60" y1="35" x2="40" y2="45" stroke="#FF6B00" stroke-width="1.5" opacity="0.6"/>
    <line x1="40" y1="25" x2="40" y2="45" stroke="#FF6B00" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Company name -->
  <text x="20" y="55" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">
    EZ-ZAHRAOUI
  </text>
  <text x="20" y="85" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="600" fill="#FF6B00" letter-spacing="1">
    IT SERVICES
  </text>

  <!-- Accent line -->
  <line x1="20" y1="95" x2="180" y2="95" stroke="#FF6B00" stroke-width="2"/>
</svg>
